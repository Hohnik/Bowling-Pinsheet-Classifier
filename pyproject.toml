[project]
name = "pin"
version = "0.3.0"
description = "Fast nine-pin score-sheet scanning with ONNX and OpenCV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.0",
]

[tool.ruff]
lint.extend-select = ["C901"]
lint.mccabe.max-complexity = 8
