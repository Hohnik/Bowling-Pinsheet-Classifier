[project]
name = "pin"
version = "0.3.0"
description = "Two-model nine-pin score-sheet scanning with OpenCV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.0",
]
train = [
    "albumentations>=2.0.8",
    "modal>=1.6.0",
    "onnx>=1.19.0",
    "onnxslim>=0.1.71",
    "torch>=2.9.0",
    "ultralytics>=8.3.0",
]

[tool.ruff]
extend-exclude = [".agents"]
lint.extend-select = ["C901"]
lint.mccabe.max-complexity = 8
